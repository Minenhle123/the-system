<title>Gate not found — THE SYSTEM</title>
<script>
/* GitHub Pages serves this page for a missing path at any depth, so relative
   links would resolve against the wrong folder. Anchor them to the site root:
   the first path segment on a project site (username.github.io/the-system/). */
(function () {
  var host = location.hostname, seg = location.pathname.split('/')[1], root = '/';
  if (seg && seg !== '404.html' && (/\.github\.io$/.test(host) || host === 'localhost' || host === '127.0.0.1')) root = '/' + seg + '/';
  var b = document.createElement('base');
  b.href = root;
  document.head.appendChild(b);
})();
</script>
<meta name="robots" content="noindex">
<meta property="og:title" content="THE SYSTEM — Level up in real life">
